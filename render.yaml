services:
  # ------------------------------------------------------------------
  # SERVICE 1: THE SOCIETY — NEXT.JS 16 APPS & PORTAL (FRONTEND)
  # ------------------------------------------------------------------
  - type: web
    name: the-society-web
    runtime: node
    rootDir: frontend-next
    buildCommand: pnpm install && pnpm run build
    startCommand: pnpm run start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.14.0
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: FASTAPI_INTERNAL_URL
        fromService:
          type: web
          name: pulse-realtime-chat
          property: host

  # ------------------------------------------------------------------
  # SERVICE 2: THE SOCIETY — FASTAPI CORE AUTHORITY (BACKEND)
  # ------------------------------------------------------------------
  - type: web
    name: pulse-realtime-chat
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"
