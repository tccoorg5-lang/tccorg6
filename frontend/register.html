<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulse Chat - Join with Invite</title>
  <link rel="stylesheet" href="css/style.css?v=2.2">
  <link rel="stylesheet" href="css/auth.css?v=2.2">
  <link rel="stylesheet" href="css/responsive.css?v=2.2">
  <script>
    const savedTheme = localStorage.getItem('pulse_theme') || 
      (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', savedTheme);
  </script>
</head>
<body class="auth-page">
  <button id="themeToggleBtn" class="icon-btn auth-theme-toggle" aria-label="Toggle Theme" title="Toggle Theme">
    <svg id="themeIconSun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
      <circle cx="12" cy="12" r="5"></circle>
      <line x1="12" y1="1" x2="12" y2="3"></line>
      <line x1="12" y1="21" x2="12" y2="23"></line>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
      <line x1="1" y1="12" x2="3" y2="12"></line>
      <line x1="21" y1="12" x2="23" y2="12"></line>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
    </svg>
    <svg id="themeIconMoon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
    </svg>
  </button>

  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <h1 class="auth-title">Join Private Chat</h1>
      <p class="auth-subtitle">Enter your private invite code to connect</p>
    </div>

    <div id="authAlert" class="auth-alert" role="alert"></div>

    <form id="registerForm" class="auth-form" autocomplete="on">
      <div class="form-group">
        <label class="form-label" for="regInviteCode">Invite Code</label>
        <div class="form-input-wrapper">
          <svg class="form-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path>
          </svg>
          <input 
            type="text" 
            id="regInviteCode" 
            class="form-input" 
            placeholder="e.g. VIP-2024" 
            required 
            autocomplete="off"
            style="text-transform: uppercase; font-weight: 600; letter-spacing: 1px;"
          >
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="regUsername">Choose Username</label>
        <div class="form-input-wrapper">
          <svg class="form-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <input 
            type="text" 
            id="regUsername" 
            class="form-input" 
            placeholder="e.g. Alex" 
            required 
            minlength="2"
            maxlength="24"
            autocomplete="username"
          >
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="regPassword">Password</label>
        <div class="form-input-wrapper">
          <svg class="form-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <input 
            type="password" 
            id="regPassword" 
            class="form-input" 
            placeholder="At least 6 characters" 
            minlength="6"
            required 
            autocomplete="new-password"
          >
          <button type="button" class="password-toggle-btn toggle-reg-pwd" aria-label="Toggle password visibility">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" id="regSubmitBtn" class="auth-btn-submit">
        <span>Join Private Chat</span>
      </button>
    </form>

    <div class="auth-footer">
      Already registered? <a href="login.html" class="auth-link">Log In</a>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <!-- Supabase CDN Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- App Scripts -->
  <script src="js/config.js?v=2.2"></script>
  <script src="js/supabase.js?v=2.2"></script>
  <script src="js/api.js?v=2.2"></script>
  <script src="js/auth.js?v=2.2"></script>
</body>
</html>
