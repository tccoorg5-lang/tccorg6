<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Society — Private Induction</title>
  <link rel="stylesheet" href="css/style.css?v=3.0">
  <link rel="stylesheet" href="css/society.css?v=3.0">
  <link rel="stylesheet" href="css/auth.css?v=3.0">
  <link rel="stylesheet" href="css/responsive.css?v=3.0">
</head>
<body class="auth-page society-theme">

  <div class="auth-card society-card" style="max-width: 460px;">
    <!-- Society Seal Insignia -->
    <div class="society-emblem">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
      </svg>
    </div>

    <h1 class="society-title">Private Society</h1>
    <p class="society-subtitle">Restricted Induction • Cryptographic Token</p>

    <div id="authAlert" class="auth-alert" role="alert"></div>

    <form id="inductionForm" class="auth-form" autocomplete="off">
      <!-- Step 1: Cryptographic Invitation Token -->
      <div class="society-form-group">
        <label class="society-label" for="tokenInput">Invitation Token</label>
        <div style="display: flex; gap: 8px;">
          <input 
            type="text" 
            id="tokenInput" 
            class="society-input" 
            style="flex: 1; font-family: monospace; letter-spacing: 1px;" 
            placeholder="ps_..." 
            required
            autocomplete="off"
          >
          <button type="button" id="verifyTokenBtn" class="society-btn-primary" style="width: auto; padding: 0 16px; font-size: 0.75rem;">
            Verify
          </button>
        </div>
      </div>

      <!-- Verified Candidate Banner (Revealed on Valid Token) -->
      <div id="verifiedBanner" class="invite-verification-banner">
        <div style="font-size: 0.72rem; letter-spacing: 1px; color: var(--gold-primary); text-transform: uppercase; margin-bottom: 4px;">
          Society Record Validated
        </div>
        <div style="display: flex; justify-content: space-between; align-items: baseline;">
          <span style="font-size: 0.85rem; color: var(--text-muted);">Assigned Codename:</span>
          <span id="bannerCodename" class="assigned-codename-tag">VANGUARD</span>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: baseline; margin-top: 4px;">
          <span style="font-size: 0.85rem; color: var(--text-muted);">Assigned Rank:</span>
          <span id="bannerRank" style="font-size: 0.85rem; color: var(--text-platinum); font-weight: 600;">Initiate</span>
        </div>
      </div>

      <!-- Step 2: Email & Master Password (Active after token verification or filled simultaneously) -->
      <div id="credentialsSection">
        <div class="society-form-group">
          <label class="society-label" for="emailInput">Intended Recipient Email</label>
          <input 
            type="email" 
            id="emailInput" 
            class="society-input" 
            placeholder="your-registered-email@domain.com" 
            required 
            autocomplete="email"
          >
          <span style="font-size: 0.72rem; color: var(--text-muted); margin-top: 2px;">
            Must match the exact email assigned to this invitation.
          </span>
        </div>

        <div class="society-form-group">
          <label class="society-label" for="passwordInput">Choose Vault Password</label>
          <input 
            type="password" 
            id="passwordInput" 
            class="society-input" 
            placeholder="Minimum 6 characters" 
            minlength="6"
            required 
            autocomplete="new-password"
          >
        </div>
      </div>

      <button type="submit" id="redeemSubmitBtn" class="society-btn-primary" style="margin-top: 10px;">
        <span>Claim Codename & Enter</span>
      </button>
    </form>

    <div class="auth-footer" style="margin-top: 24px; border-top: 1px solid var(--gold-border-subtle); padding-top: 16px;">
      Existing Member? <a href="login.html" class="society-link">Sign In with Codename</a>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <!-- Supabase CDN Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- App Scripts -->
  <script src="js/config.js?v=3.0"></script>
  <script src="js/supabase.js?v=3.0"></script>
  <script src="js/api.js?v=3.0"></script>
  <script src="js/society_onboarding.js?v=3.0"></script>
</body>
</html>
