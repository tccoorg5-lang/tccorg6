<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Society — Candidate Induction Gate</title>
  <link rel="stylesheet" href="css/style.css?v=4.0">
  <link rel="stylesheet" href="css/society.css?v=4.0">
  <link rel="stylesheet" href="css/auth.css?v=4.0">
  <link rel="stylesheet" href="css/responsive.css?v=4.0">
</head>
<body class="auth-page society-theme">

  <!-- Ambient Security Lattice Architecture (Background SVG) -->
  <div class="auth-bg-lattice" aria-hidden="true">
    <svg viewBox="0 0 400 400" fill="none" stroke="currentColor">
      <circle cx="200" cy="200" r="185" stroke="#C5A059" stroke-width="0.75" stroke-dasharray="4 8" opacity="0.35" />
      <circle cx="200" cy="200" r="145" stroke="#D8B26E" stroke-width="0.75" stroke-dasharray="8 6" opacity="0.5" />
      <circle cx="200" cy="200" r="105" stroke="#C5A059" stroke-width="1" opacity="0.6" />
      <circle cx="200" cy="200" r="65" stroke="#D8B26E" stroke-width="1" stroke-dasharray="2 4" opacity="0.4" />
      <line x1="200" y1="10" x2="200" y2="390" stroke="#C5A059" stroke-width="0.5" stroke-dasharray="2 6" opacity="0.25" />
      <line x1="10" y1="200" x2="390" y2="200" stroke="#C5A059" stroke-width="0.5" stroke-dasharray="2 6" opacity="0.25" />
      <circle cx="200" cy="200" r="3" fill="#D8B26E" opacity="0.8" />
    </svg>
  </div>

  <div class="auth-card" style="max-width: 480px;">
    <!-- Society Heraldic Seal -->
    <div class="society-emblem">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="46" stroke="#C5A059" stroke-width="2" opacity="0.9" />
        <circle cx="50" cy="50" r="41" stroke="#D8B26E" stroke-width="0.75" stroke-dasharray="2 3" opacity="0.75" />
        <circle cx="50" cy="50" r="33" fill="#161A22" stroke="#C5A059" stroke-width="1" />
        <polygon points="50,22 58,40 78,40 62,52 68,72 50,60 32,72 38,52 22,40 42,40" fill="url(#goldGrad)" stroke="#D8B26E" stroke-width="0.75" />
        <defs>
          <linearGradient id="goldGrad" x1="20" y1="20" x2="80" y2="80" gradientUnits="userSpaceOnUse">
            <stop stop-color="#D8B26E" />
            <stop offset="0.5" stop-color="#C5A059" />
            <stop offset="1" stop-color="#8C6D2D" />
          </linearGradient>
        </defs>
      </svg>
    </div>

    <h1 class="society-title" style="font-size: 1.25rem;">CANDIDATE INDUCTION</h1>
    <p class="society-subtitle">Discretion &bull; Loyalty &bull; Excellence</p>

    <!-- Operational Telemetry Status Pill -->
    <div class="auth-telemetry-pill">
      <span class="auth-telemetry-dot"></span>
      <span>INVITATION GATE &bull; ED25519 VERIFICATION</span>
    </div>

    <div id="authAlert" class="auth-alert" role="alert"></div>

    <form id="inductionForm" class="auth-form" autocomplete="off">
      <!-- Step 1: Cryptographic Invitation Token -->
      <div class="society-form-group">
        <label class="society-label" for="tokenInput">Invitation Token</label>
        <div style="display: flex; gap: 8px;">
          <input 
            type="text" 
            id="tokenInput" 
            class="society-input" 
            style="flex: 1; font-family: monospace; letter-spacing: 1px;" 
            placeholder="ps_token_..." 
            required
            autocomplete="off"
          >
          <button type="button" id="verifyTokenBtn" class="society-btn-primary" style="width: auto; padding: 0 16px; font-size: 0.75rem;">
            Verify
          </button>
        </div>
      </div>

      <!-- Verified Candidate Banner (Revealed on Valid Token) -->
      <div id="verifiedBanner" class="invite-verification-banner">
        <div style="font-size: 0.72rem; letter-spacing: 1px; color: var(--antique-gold); text-transform: uppercase; margin-bottom: 4px;">
          Society Record Validated
        </div>
        <div style="display: flex; justify-content: space-between; align-items: baseline;">
          <span style="font-size: 0.85rem; color: var(--muted-silver);">Conferred Codename:</span>
          <span id="bannerCodename" class="assigned-codename-tag">VANGUARD</span>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: baseline; margin-top: 4px;">
          <span style="font-size: 0.85rem; color: var(--muted-silver);">Assigned Rank:</span>
          <span id="bannerRank" style="font-size: 0.85rem; color: var(--platinum); font-weight: 600;">Initiate</span>
        </div>
      </div>

      <!-- Step 2: Email & Master Password -->
      <div id="credentialsSection">
        <div class="society-form-group">
          <label class="society-label" for="emailInput">Nominated Recipient Email</label>
          <input 
            type="email" 
            id="emailInput" 
            class="society-input" 
            placeholder="your-registered-email@domain.com" 
            required 
            autocomplete="email"
          >
          <span style="font-size: 0.72rem; color: var(--muted-silver); margin-top: 2px;">
            Must match the exact email assigned to this invitation.
          </span>
        </div>

        <div class="society-form-group" style="margin-top: 12px;">
          <label class="society-label" for="passwordInput">Establish Vault Passphrase</label>
          <input 
            type="password" 
            id="passwordInput" 
            class="society-input" 
            placeholder="Minimum 6 characters" 
            minlength="6"
            required 
            autocomplete="new-password"
          >
        </div>
      </div>

      <button type="submit" id="redeemSubmitBtn" class="society-btn-primary" style="margin-top: 10px;">
        <span>Affirm Covenant & Complete Induction</span>
      </button>
    </form>

    <div class="auth-footer" style="margin-top: 24px; border-top: 1px solid var(--border-charcoal); padding-top: 16px;">
      Existing Member? <a href="login.html" class="society-link">Sign In with Codename</a>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <!-- Supabase CDN Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- App Scripts -->
  <script src="js/config.js?v=4.0"></script>
  <script src="js/supabase.js?v=4.0"></script>
  <script src="js/api.js?v=4.0"></script>
  <script src="js/society_onboarding.js?v=4.0"></script>
</body>
</html>
