<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Society — Classified Clearance & Entrance</title>
  <link rel="stylesheet" href="css/style.css?v=4.0">
  <link rel="stylesheet" href="css/society.css?v=4.0">
  <link rel="stylesheet" href="css/auth.css?v=4.0">
  <link rel="stylesheet" href="css/responsive.css?v=4.0">
</head>
<body class="auth-page society-theme">

  <!-- Ambient Security Lattice Architecture (Background SVG) -->
  <div class="auth-bg-lattice" aria-hidden="true">
    <svg viewBox="0 0 400 400" fill="none" stroke="currentColor">
      <circle cx="200" cy="200" r="185" stroke="#C5A059" stroke-width="0.75" stroke-dasharray="4 8" opacity="0.35" />
      <circle cx="200" cy="200" r="145" stroke="#D8B26E" stroke-width="0.75" stroke-dasharray="8 6" opacity="0.5" />
      <circle cx="200" cy="200" r="105" stroke="#C5A059" stroke-width="1" opacity="0.6" />
      <circle cx="200" cy="200" r="65" stroke="#D8B26E" stroke-width="1" stroke-dasharray="2 4" opacity="0.4" />
      <line x1="200" y1="10" x2="200" y2="390" stroke="#C5A059" stroke-width="0.5" stroke-dasharray="2 6" opacity="0.25" />
      <line x1="10" y1="200" x2="390" y2="200" stroke="#C5A059" stroke-width="0.5" stroke-dasharray="2 6" opacity="0.25" />
      <circle cx="200" cy="200" r="3" fill="#D8B26E" opacity="0.8" />
    </svg>
  </div>

  <div class="auth-card">
    <!-- Society Heraldic Seal -->
    <div class="society-emblem">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="46" stroke="#C5A059" stroke-width="2" opacity="0.9" />
        <circle cx="50" cy="50" r="41" stroke="#D8B26E" stroke-width="0.75" stroke-dasharray="2 3" opacity="0.75" />
        <circle cx="50" cy="50" r="33" fill="#161A22" stroke="#C5A059" stroke-width="1" />
        <polygon points="50,22 58,40 78,40 62,52 68,72 50,60 32,72 38,52 22,40 42,40" fill="url(#goldGrad)" stroke="#D8B26E" stroke-width="0.75" />
        <defs>
          <linearGradient id="goldGrad" x1="20" y1="20" x2="80" y2="80" gradientUnits="userSpaceOnUse">
            <stop stop-color="#D8B26E" />
            <stop offset="0.5" stop-color="#C5A059" />
            <stop offset="1" stop-color="#8C6D2D" />
          </linearGradient>
        </defs>
      </svg>
    </div>

    <h1 class="society-title">THE SOCIETY</h1>
    <p class="society-subtitle">Vault Clearance &bull; Sovereign Gate</p>

    <!-- Operational Telemetry Status Pill -->
    <div class="auth-telemetry-pill">
      <span class="auth-telemetry-dot"></span>
      <span>ZERO-TRUST RLS &bull; TLS 1.3 &bull; ED25519 CIPHER</span>
    </div>

    <div id="authAlert" class="auth-alert" role="alert"></div>

    <form id="societyLoginForm" class="auth-form" autocomplete="on">
      <div class="society-form-group">
        <label class="society-label" for="loginIdentifier">Official Codename or Email</label>
        <input 
          type="text" 
          id="loginIdentifier" 
          class="society-input" 
          placeholder="e.g. Sovereign, Vanguard, or classified email" 
          required 
          autocomplete="username"
        >
      </div>

      <div class="society-form-group">
        <label class="society-label" for="loginPassword">Master Vault Passphrase</label>
        <div style="position: relative; display: flex; align-items: center;">
          <input 
            type="password" 
            id="loginPassword" 
            class="society-input" 
            style="width: 100%; padding-right: 44px;" 
            placeholder="••••••••••••" 
            required 
            autocomplete="current-password"
          >
          <button type="button" id="togglePasswordBtn" class="password-toggle-btn" style="position: absolute; right: 10px; color: var(--antique-gold);" aria-label="Toggle password visibility">
            <svg id="eyeIconOpen" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg id="eyeIconClosed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" id="loginSubmitBtn" class="society-btn-primary" style="margin-top: 10px;">
        <span>Verify Vault Clearance</span>
      </button>
    </form>

    <div class="auth-footer" style="margin-top: 24px; border-top: 1px solid var(--border-charcoal); padding-top: 16px;">
      Possess an Invitation Token? <a href="register.html" class="society-link">Commence Induction</a>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <!-- Supabase CDN Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- App Scripts -->
  <script src="js/config.js?v=4.0"></script>
  <script src="js/supabase.js?v=4.0"></script>
  <script src="js/api.js?v=4.0"></script>
  <script src="js/society_onboarding.js?v=4.0"></script>
</body>
</html>
