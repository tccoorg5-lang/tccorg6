<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Society — Member Access</title>
  <link rel="stylesheet" href="css/style.css?v=3.0">
  <link rel="stylesheet" href="css/society.css?v=3.0">
  <link rel="stylesheet" href="css/auth.css?v=3.0">
  <link rel="stylesheet" href="css/responsive.css?v=3.0">
</head>
<body class="auth-page society-theme">

  <div class="auth-card society-card" style="max-width: 440px;">
    <!-- Society Seal Insignia -->
    <div class="society-emblem">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
      </svg>
    </div>

    <h1 class="society-title">The Society</h1>
    <p class="society-subtitle">Restricted Access • Authenticated Portal</p>

    <div id="authAlert" class="auth-alert" role="alert"></div>

    <form id="societyLoginForm" class="auth-form" autocomplete="on">
      <div class="society-form-group">
        <label class="society-label" for="loginIdentifier">Official Codename or Email</label>
        <input 
          type="text" 
          id="loginIdentifier" 
          class="society-input" 
          placeholder="e.g. Sovereign, Vanguard, or email" 
          required 
          autocomplete="username"
        >
      </div>

      <div class="society-form-group">
        <label class="society-label" for="loginPassword">Master Vault Password</label>
        <div style="position: relative; display: flex; align-items: center;">
          <input 
            type="password" 
            id="loginPassword" 
            class="society-input" 
            style="width: 100%; padding-right: 40px;" 
            placeholder="••••••••" 
            required 
            autocomplete="current-password"
          >
          <button type="button" id="togglePasswordBtn" class="password-toggle-btn" style="position: absolute; right: 10px; color: var(--gold-primary);" aria-label="Toggle password visibility">
            <svg id="eyeIconOpen" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg id="eyeIconClosed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" id="loginSubmitBtn" class="society-btn-primary" style="margin-top: 10px;">
        <span>Enter Society Vault</span>
      </button>
    </form>

    <div class="auth-footer" style="margin-top: 24px; border-top: 1px solid var(--gold-border-subtle); padding-top: 16px;">
      Possess an Invitation Token? <a href="register.html" class="society-link">Complete Induction</a>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <!-- Supabase CDN Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- App Scripts -->
  <script src="js/config.js?v=3.0"></script>
  <script src="js/supabase.js?v=3.0"></script>
  <script src="js/api.js?v=3.0"></script>
  <script src="js/society_onboarding.js?v=3.0"></script>
</body>
</html>
