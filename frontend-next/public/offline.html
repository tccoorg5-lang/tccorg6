<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Society — Offline State</title>
  <style>
    :root {
      --bg: #080A0E;
      --card: #0F1218;
      --border: #262C3A;
      --gold: #C5A059;
      --gold-imp: #D8B26E;
      --ivory: #E9E2D3;
      --muted: #858995;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ivory);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .offline-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      max-width: 440px;
      padding: 36px 28px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.8);
      position: relative;
    }
    .offline-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }
    .seal {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      color: var(--gold);
    }
    h1 {
      font-family: "Cinzel", Georgia, serif;
      font-size: 1.3rem;
      color: var(--gold-imp);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    p {
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      background: var(--gold);
      color: #080A0E;
      font-weight: 600;
      font-size: 0.8rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 10px 22px;
      border-radius: 4px;
      text-decoration: none;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <svg class="seal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
    </svg>
    <h1>Vault Network Offline</h1>
    <p>
      An active encrypted connection to The Society infrastructure is required to verify credentials and synchronize confidential dispatches.
    </p>
    <button class="btn" onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
